name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 构建期断言（vite.config.ts）：生产构建必须显式提供 VITE_API_BASE，或显式声明同源模式，
# 否则构建失败。GitHub Pages 是纯静态演示（数据源为 mock、接口路径本身就带 /api 前缀），
# 所以这里显式声明同源 —— 也顺手锁住「不要回退到访客自己的 localhost」这条约束。
env:
  VITE_ALLOW_SAME_ORIGIN: '1'

jobs:
  # ── 质量关卡：类型检查、lint、单测 ──
  quality:
    name: Quality（tsc + lint + unit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit -p tsconfig.json && pnpm exec tsc --noEmit -p tsconfig.node.json

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

  # ── E2E：真实浏览器跑三条主链路（默认 base='/'） ──
  e2e:
    name: E2E（三条主链路）
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build（base='/'）
        run: pnpm run build

      - name: Generate SPA fallback
        run: node scripts/postbuild.mjs

      - name: Run E2E
        run: pnpm run test:e2e
        env:
          # CI 环境用 Playwright 自带的 chromium，不走系统 chrome
          PLAYWRIGHT_CHROMIUM_CHANNEL: ''

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ── 子路径回归：验证 /lst/ 部署形态（GitHub Pages 的真实形态） ──
  e2e-subpath:
    name: E2E（子路径 /lst/）
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build（base='/lst/'）
        run: pnpm run build
        env:
          VITE_BASE: /lst/

      - name: Generate SPA fallback
        run: node scripts/postbuild.mjs

      - name: Run subpath E2E
        run: pnpm run test:e2e:subpath

  # ── 构建产物 ──
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [e2e, e2e-subpath]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check and build
        run: pnpm run build
        env:
          VITE_BASE: /lst/

      - name: Generate SPA fallback
        run: node scripts/postbuild.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── 部署（仅 main 推送时） ──
  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
