<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="工科影展——分享拍摄作品、拍摄地点与心得的摄影社区（演示模式）"
    />
    <title>工科影展 · 摄影作品社区</title>
    <script>
      // 首屏前应用主题与外观，避免闪白/配色跳变（令牌见 src/styles/tokens.css 与 appearance.css）
      try {
        var p = JSON.parse(localStorage.getItem('gy:prefs') || '{}')
        var t = (p.state && p.state.theme) || 'system'
        var d =
          t === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : t
        document.documentElement.dataset.theme = d

        // 外观设置：配色 / 字体 / 字号（背景照片的遮罩由 React 侧按采样亮度算，这里不处理）
        var a = JSON.parse(localStorage.getItem('gy:appearance') || '{}')
        var s = (a && a.state) || a || {}
        if (s.palette && s.palette !== 'auto') document.documentElement.dataset.palette = s.palette
        if (s.font) document.documentElement.dataset.font = s.font
        // 字号档位守卫放宽到 12–24（= FONT_SIZE_MIN..FONT_SIZE_MAX）。
        // 原来的 >=14 && <=20 让选 12 或 24 的用户首屏跳一次字号 ——
        // Hero 从 48px 提到 72px 后，这一跳会明显得多（60 → 72），所以一并修掉。
        if (typeof s.baseFontSize === 'number' && s.baseFontSize >= 12 && s.baseFontSize <= 24) {
          var b = Math.round(s.baseFontSize)
          var r = document.documentElement.style
          r.setProperty('--g-text-xs', Math.round((b * 12) / 16) + 'px')
          r.setProperty('--g-text-sm', Math.round((b * 14) / 16) + 'px')
          r.setProperty('--g-text-base', b + 'px')
          r.setProperty('--g-text-lg', Math.round((b * 24) / 16) + 'px')
          r.setProperty('--g-text-xl', Math.round((b * 36) / 16) + 'px')
          r.setProperty('--g-text-2xl', Math.round((b * 48) / 16) + 'px')
          // 与 src/domain/appearance.ts 的 textScaleFor().hero 完全同式（48–72，12 的整数倍）
          r.setProperty(
            '--g-text-hero',
            Math.min(72, Math.max(48, Math.round((b * 72) / 16 / 12) * 12)) + 'px',
          )
        }
        if (s.subject) document.documentElement.dataset.subject = s.subject
        // 主体目录已换代：px-grid / px-halftone / px-scanline 三套被删除，
        // 旧值在预涂阶段就落定到 px-none，否则首帧会先按已不存在的旧主体渲染一次。
        if (
          s.subject === 'px-grid' ||
          s.subject === 'px-halftone' ||
          s.subject === 'px-scanline'
        ) {
          document.documentElement.dataset.subject = 'px-none'
        }
      } catch (e) {
        /* 忽略损坏的偏好数据 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
